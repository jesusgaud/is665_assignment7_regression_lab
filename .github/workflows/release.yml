name: Release Package
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=regression_lab --cov-report=term-missing --cov-fail-under=80
      - name: Build source ZIP
        run: |
          zip -r is665_assignment7_regression_lab_${{ github.ref_name }}.zip . \
            -x '.git/*' '.venv/*' '__pycache__/*' '.pytest_cache/*' 'results/*' 'data/insurance.csv'
      - uses: softprops/action-gh-release@v2
        with:
          files: is665_assignment7_regression_lab_${{ github.ref_name }}.zip
